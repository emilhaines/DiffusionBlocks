[project]
name = "DiffusionBlocks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "lightning==2.5.0",
    "wandb==0.18.6",
    "transformers==4.52.4",
    "datasets==3.5.0",
    "huggingface-hub[hf-xet]>=0.31.2",
    "hf-transfer>=0.1.9",
    "scipy>=1.16.2",
    "clean-fid>=0.1.35",
    "structlog>=26.1.0",
]


[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'"}
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'"}
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.pyright]
include = ["main.py", "config.py", "model.py", "data.py", "dblock_modules.py", "dit.py", "vit.py", "evaluation.py", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88  # the repo's existing (black) style
extend-exclude = ["docs"]
